plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
    id 'java'
}

base { archivesName = 'jmchunkbridge-fabric-26.3' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.166.0+26.3'
    compileOnly 'maven.modrinth:journeymap:26.3-6.0.10+fabric'
}
